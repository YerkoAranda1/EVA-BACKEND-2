<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameGo - Añadir Juego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'listar_juegos' %}">🎮 GameGo Admin</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">

                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0 fw-bold">Registrar Nuevo Videojuego</h4>
                    </div>

                    <div class="card-body bg-dark text-white">

                        {% if error %}
                            <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}

                        <form method="POST" action="">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label fw-bold">Título del juego</label>
                                <input type="text" name="titulo" class="form-control text-dark"
                                       placeholder="Ej. EA Sports FC 27"
                                       value="{{ datos.titulo|default:'' }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Plataforma</label>
                                <input type="text" name="plataforma" class="form-control text-dark"
                                       placeholder="Ej. PS5, Xbox Series X, PC"
                                       value="{{ datos.plataforma|default:'' }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Género</label>
                                <input type="text" name="genero" class="form-control text-dark"
                                       placeholder="Ej. Deportes, RPG, Acción"
                                       value="{{ datos.genero|default:'' }}" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Precio ($)</label>
                                    <input type="number" name="precio" class="form-control text-dark"
                                           min="1" value="{{ datos.precio|default:'' }}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Stock Inicial</label>
                                    <input type="number" name="stock" class="form-control text-dark"
                                           min="0" value="{{ datos.stock|default:'' }}" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Fecha de estreno (MM/DD/YYYY)</label>
                                <input type="text" name="fecha_estreno" class="form-control text-dark"
                                       placeholder="Ej. 12/25/2024"
                                       pattern="(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/[0-9]{4}"
                                       title="Usa el formato MM/DD/YYYY, por ejemplo 12/25/2024"
                                       maxlength="10"
                                       value="{{ datos.fecha_estreno|default:'' }}" required>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a href="{% url 'listar_juegos' %}" class="btn btn-outline-light fw-bold">Cancelar y Volver</a>
                                <button type="submit" class="btn btn-success fw-bold px-4">Guardar Videojuego</button>
                            </div>

                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
