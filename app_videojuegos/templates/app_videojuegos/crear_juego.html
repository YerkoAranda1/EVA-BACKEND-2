<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameGo - Añadir Juego</title>
    <!-- Cargamos Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'listar_juegos' %}">🎮 GameGo Admin</a>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    
                    <!-- Encabezado del formulario -->
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0 fw-bold">Registrar Nuevo Videojuego</h4>
                    </div>
                    
                    <!-- Cuerpo del formulario -->
                    <div class="card-body bg-dark text-white">
                        
                        <!-- action="" vacío significa que enviará los datos a la misma ruta actual (/crear/) -->
                        <form method="POST" action="">
                            {% csrf_token %} <!-- Etiqueta obligatoria de seguridad en Django -->
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Título del juego</label>
                                <!-- El name="titulo" conecta directamente con request.POST['titulo'] en views.py -->
                                <input type="text" name="titulo" class="form-control text-dark" placeholder="Ej. EA Sports FC 27" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Plataforma</label>
                                <!-- El name="plataforma" conecta con request.POST['plataforma'] -->
                                <input type="text" name="plataforma" class="form-control text-dark" placeholder="Ej. PS5, Xbox Series X, PC" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Género</label>
                                <!-- El name="genero" conecta con request.POST['genero'] -->
                                <input type="text" name="genero" class="form-control text-dark" placeholder="Ej. Deportes, RPG, Acción" required>
                            </div>

                            <!-- AQUÍ ESTABA EL CORTE: Campos de Precio y Stock -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Precio ($)</label>
                                    <input type="number" name="precio" class="form-control text-dark" min="1" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Stock Inicial</label>
                                    <input type="number" name="stock" class="form-control text-dark" min="0" required>
                                </div>
                            </div>

                            <!-- Botones de acción -->
                            <div class="d-flex justify-content-between mt-4">
                                <a href="{% url 'listar_juegos' %}" class="btn btn-outline-light fw-bold">Cancelar y Volver</a>
                                <button type="submit" class="btn btn-success fw-bold px-4">Guardar Videojuego</button>
                            </div>
                            
                        </form>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

</body>
</html>
