<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameGo - Editar Juego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'listar_juegos' %}">🎮 GameGo Admin</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    
                    <!-- Encabezado amarillo para diferenciarlo del formulario de creación -->
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0 fw-bold">Modificar Datos del Videojuego</h4>
                    </div>
                    
                    <div class="card-body bg-dark text-white">
                        <form method="POST" action="">
                            {% csrf_token %}
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Título del juego</label>
                                <!-- Pre-llenamos con value="{{ juego.titulo }}" -->
                                <input type="text" name="titulo" value="{{ juego.titulo }}" class="form-control text-dark" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Plataforma</label>
                                <input type="text" name="plataforma" value="{{ juego.plataforma }}" class="form-control text-dark" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Género</label>
                                <input type="text" name="genero" value="{{ juego.genero }}" class="form-control text-dark" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Precio ($)</label>
                                    <input type="number" name="precio" value="{{ juego.precio }}" class="form-control text-dark" min="1" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Stock</label>
                                    <input type="number" name="stock" value="{{ juego.stock }}" class="form-control text-dark" min="0" required>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a href="{% url 'listar_juegos' %}" class="btn btn-outline-light fw-bold">Cancelar</a>
                                <button type="submit" class="btn btn-warning fw-bold px-4">Actualizar Videojuego</button>
                            </div>
                            
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
