<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameGo - Eliminar Juego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'listar_juegos' %}">🎮 GameGo Admin</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-danger">
                    
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0 fw-bold">⚠️ Confirmar Eliminación</h4>
                    </div>
                    
                    <div class="card-body bg-dark text-white text-center py-4">
                        <h5 class="mb-4">¿Estás seguro de que deseas eliminar permanentemente el juego <span class="text-danger fw-bold">"{{ juego.titulo }}"</span> del catálogo?</h5>
                        <p class="text-muted mb-4">Esta acción borrará el registro de la base de datos MySQL y no se puede deshacer.</p>
                        
                        <form method="POST" action="">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center gap-3">
                                <a href="{% url 'listar_juegos' %}" class="btn btn-secondary fw-bold px-4">Cancelar</a>
                                <button type="submit" class="btn btn-danger fw-bold px-4">Sí, Eliminar Definitivamente</button>
                            </div>
                        </form>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

</body>
</html>
